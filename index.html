<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DoDoReMi Editor (Svelte)</title>
  </head>
  <body>
    <div id="app"></div>
    <script>
      // diagnostic: only notify local backend when running on localhost (avoid CORS from GitHub Pages)
      try {
        const host = window.location.hostname;
        if (host === 'localhost' || host === '127.0.0.1') {
          fetch('http://localhost:3000/api/_client_loaded', { method: 'POST' }).catch(() => {});
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
